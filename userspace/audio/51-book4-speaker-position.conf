# Book4 Edge speaker channel map.
#
# The speaker PCM is fixed at four channels and exports no channel map. The kernel
# (sound/soc/qcom/x1e80100.c, x1e80100_snd_hw_map_channels) defines the slots as
# FL, LB, FR, RB, so front-right is slot 2; with the default FL,FR guess the right
# channel lands in the left-back slot and only the left speaker plays.
#
# Matched on the speaker node, not the card: the headphones sink on the same card
# is a normal 2-channel device.
#
# Headroom: the DSP keeps ~2,700-3,400 frames queued; following another driver (the mic,
# Bluetooth) PipeWire expected 736, rewound every cycle and could not - a buzz at the cycle
# rate. 3072 matches the queue (2026-10-08: 0 resyncs in 8 s, was ~2,000).

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*[Ss]peaker.*"
      }
      # Fallback: the speaker PCM is hw:0,1, the headphones hw:0,0.
      {
        api.alsa.pcm.device = "1"
        api.alsa.pcm.stream = "playback"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 4
        audio.position = [ FL RL FR RR ]
        api.alsa.headroom = 3072
      }
    }
  }
]
